name: news
on:
  schedule:
    - cron: "0 */4 * * *"   # ogni 4 ore (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_news.py
      - name: Commit se cambiato
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.txt
          git diff --cached --quiet || git commit -m "news $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
