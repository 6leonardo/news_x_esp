name: quotes
on:
  schedule:
    - cron: "10 * * * *"   # ogni ora al minuto 10 (UTC), sfasato da news.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_quotes.py
      - name: Commit se cambiato
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add quotes.txt
          git diff --cached --quiet || git commit -m "quotes $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
